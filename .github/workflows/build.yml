name: Build

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  build:
    name: Build, test, and package
    runs-on: windows-latest
    outputs:
      package_name: ${{ steps.package.outputs.package_name }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.8.x

      - name: Determine semantic version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          configFilePath: GitVersion.yml
          updateAssemblyInfo: false
          updateProjectFiles: false

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          SEMVER: ${{ steps.gitversion.outputs.semVer }}
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Release tags must have the form vMAJOR.MINOR.PATCH.'
          }
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($tagVersion -ne $env:SEMVER) {
            throw "Tag version '$tagVersion' does not match GitVersion SemVer '$env:SEMVER'."
          }
          git merge-base --is-ancestor $env:GITHUB_SHA refs/remotes/origin/master
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tags must point to a commit contained in origin/master.'
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore DJPad.sln --runtime win-x64

      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ steps.gitversion.outputs.semVer }}
          ASSEMBLY_VERSION: ${{ steps.gitversion.outputs.assemblySemVer }}
          FILE_VERSION: ${{ steps.gitversion.outputs.assemblySemFileVer }}
          INFORMATIONAL_VERSION: ${{ steps.gitversion.outputs.informationalVersion }}
        run: |
          dotnet build DJPad.sln `
            --configuration Release `
            --no-restore `
            -nodeReuse:false `
            -warnaserror `
            -p:ContinuousIntegrationBuild=true `
            -p:Version="$env:VERSION" `
            -p:AssemblyVersion="$env:ASSEMBLY_VERSION" `
            -p:FileVersion="$env:FILE_VERSION" `
            -p:InformationalVersion="$env:INFORMATIONAL_VERSION"

      - name: Test
        shell: pwsh
        env:
          VERSION: ${{ steps.gitversion.outputs.semVer }}
          ASSEMBLY_VERSION: ${{ steps.gitversion.outputs.assemblySemVer }}
          FILE_VERSION: ${{ steps.gitversion.outputs.assemblySemFileVer }}
          INFORMATIONAL_VERSION: ${{ steps.gitversion.outputs.informationalVersion }}
        run: |
          # The legacy solution maps DJPad.Core to x86. Build the test graph directly
          # so the test host receives AnyCPU dependencies in its own output folder.
          dotnet build DJPad.Tests/DJPad.Tests.csproj `
            --configuration Release `
            --no-restore `
            -nodeReuse:false `
            -warnaserror `
            -p:ContinuousIntegrationBuild=true `
            -p:Version="$env:VERSION" `
            -p:AssemblyVersion="$env:ASSEMBLY_VERSION" `
            -p:FileVersion="$env:FILE_VERSION" `
            -p:InformationalVersion="$env:INFORMATIONAL_VERSION"

          dotnet test DJPad.Tests/DJPad.Tests.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            -nodeReuse:false `
            -warnaserror `
            --filter "TestCategory!=Integration"

      - name: Publish versioned player
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.gitversion.outputs.semVer }}
          ASSEMBLY_VERSION: ${{ steps.gitversion.outputs.assemblySemVer }}
          FILE_VERSION: ${{ steps.gitversion.outputs.assemblySemFileVer }}
          INFORMATIONAL_VERSION: ${{ steps.gitversion.outputs.informationalVersion }}
        run: |
          $packageName = "Player.NET-$env:VERSION-win-x64"
          $assetName = "$packageName.exe"
          $publishDirectory = Join-Path $env:RUNNER_TEMP $packageName
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $assetPath = Join-Path $artifactDirectory $assetName
          New-Item -ItemType Directory -Force -Path $publishDirectory | Out-Null
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null

          dotnet publish Player.Avalonia/Player.Avalonia.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output $publishDirectory `
            -nodeReuse:false `
            -warnaserror `
            -p:ContinuousIntegrationBuild=true `
            -p:PublishSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version="$env:VERSION" `
            -p:AssemblyVersion="$env:ASSEMBLY_VERSION" `
            -p:FileVersion="$env:FILE_VERSION" `
            -p:InformationalVersion="$env:INFORMATIONAL_VERSION"

          Copy-Item -LiteralPath (Join-Path $publishDirectory 'Player.NET.exe') -Destination $assetPath
          "package_name=$packageName" >> $env:GITHUB_OUTPUT
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "asset_path=$assetPath" >> $env:GITHUB_OUTPUT

      - name: Upload player artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft-release:
    name: Update draft release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Update release draft
        id: release-drafter
        uses: release-drafter/release-drafter@4d75298e00d9e34c483e5ff8c68d0ea1c1940c1e # v7.5.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Publish draft executable
        id: release-package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release-drafter.outputs.tag_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Draft tag '$env:RELEASE_TAG' is not a stable semantic version."
          }

          $assetName = "Player.NET-$version-win-x64.exe"
          $publishDirectory = Join-Path $env:RUNNER_TEMP "Player.NET-$version-win-x64"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName

          dotnet restore Player.Avalonia/Player.Avalonia.csproj --runtime win-x64
          dotnet publish Player.Avalonia/Player.Avalonia.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output $publishDirectory `
            -nodeReuse:false `
            -warnaserror `
            -p:ContinuousIntegrationBuild=true `
            -p:PublishSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version="$version" `
            -p:AssemblyVersion="$version.0" `
            -p:FileVersion="$version.0" `
            -p:InformationalVersion="$version+$env:GITHUB_SHA"

          Copy-Item -LiteralPath (Join-Path $publishDirectory 'Player.NET.exe') -Destination $assetPath
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "asset_path=$assetPath" >> $env:GITHUB_OUTPUT

      - name: Replace draft executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release-drafter.outputs.id }}
          RELEASE_TAG: ${{ steps.release-drafter.outputs.tag_name }}
          ASSET_NAME: ${{ steps.release-package.outputs.asset_name }}
          ASSET_PATH: ${{ steps.release-package.outputs.asset_path }}
        run: |
          $assetIds = gh api "repos/$env:GH_REPO/releases/$env:RELEASE_ID/assets" --jq '.[].id'
          foreach ($assetId in $assetIds) {
            gh api --method DELETE "repos/$env:GH_REPO/releases/assets/$assetId"
          }

          gh release upload $env:RELEASE_TAG "$env:ASSET_PATH#$env:ASSET_NAME"
